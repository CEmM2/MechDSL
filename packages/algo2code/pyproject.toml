[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo2code"
version = "0.2.1"
description = "Transpile LaTeX algorithm boxes (algpseudocode) to executable Taichi/NumPy/C code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Shmuel Osovski" },
]
keywords = ["latex", "algorithm", "transpiler", "taichi", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# Zero runtime dependencies — stdlib only
dependencies = []

[tool.uv]
# Supply-chain safety: ignore any package version uploaded after this date.
# This blocks compromised releases from the recent pip/npm supply-chain attacks.
# Bump this date intentionally (and audit the diff in uv.lock) when upgrading deps.
exclude-newer = "2026-02-20T00:00:00Z"

[project.urls]
Repository = "https://github.com/CEmM2/MechDSL"

[tool.hatch.build.targets.wheel]
packages = ["src/algo2code"]
