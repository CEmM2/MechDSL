[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo2code"
version = "0.1.0"
description = "Transpile LaTeX algorithm boxes (algpseudocode) to executable Taichi/NumPy/C code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Shmuel Osovski" },
]
keywords = ["latex", "algorithm", "transpiler", "taichi", "code-generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
[tool.uv]
# Supply-chain safety: ignore any package version uploaded after this date.
# This blocks compromised releases from the recent pip/npm supply-chain attacks.
# Bump this date intentionally (and audit the diff in uv.lock) when upgrading deps.
exclude-newer = "2026-02-20T00:00:00Z"

# Zero runtime dependencies — stdlib only (P4 from spec)
dependencies = []

[project.urls]
Repository = "https://github.com/SOSOVSKI/MechDSL"

[tool.hatch.build.targets.wheel]
packages = ["src/algo2code"]
