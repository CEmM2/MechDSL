[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mechdsl-core"
version = "0.1.0"
description = "MechDSL core — LaTeX tensor expressions to FEM solver code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Shmuel Osovski" },
]
keywords = ["fem", "finite-elements", "computational-mechanics", "dsl", "taichi", "code-generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "opt-einsum>=3.3",
    "taichi>=1.7",
    "pyyaml>=6.0",
    "scipy>=1.17.0",
    "nrpylatex @ git+https://github.com/SOSOVSKI/nrpylatex",
]

[project.optional-dependencies]
verify = ["torch>=2.0"]

[project.urls]
Repository = "https://github.com/SOSOVSKI/MechDSL"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mechdsl"]
